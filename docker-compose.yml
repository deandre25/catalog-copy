services:
  db:
    # pgvector/pgvector instead of the plain postgres image: the vector extension
    # has to exist in the image, and stage 7 enables it from a migration.
    image: pgvector/pgvector:pg17
    container_name: catalog-copy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog_copy
    ports:
      # 5433 on the host so this never collides with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - catalog-copy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_copy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalog-copy-pgdata:
